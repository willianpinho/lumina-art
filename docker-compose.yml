version: '3.8'

services:
  lumina-backend:
    build: ./backend
    container_name: lumina-backend
    restart: always
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lumina-api.rule=Host(`lumina-api.willianpinho.com`)"
      - "traefik.http.routers.lumina-api.entrypoints=websecure"
      - "traefik.http.routers.lumina-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.lumina-api.loadbalancer.server.port=8000"

  lumina-frontend:
    build: ./frontend
    container_name: lumina-frontend
    restart: always
    networks:
      - traefik-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lumina.rule=Host(`lumina.willianpinho.com`)"
      - "traefik.http.routers.lumina.entrypoints=websecure"
      - "traefik.http.routers.lumina.tls.certresolver=letsencrypt"

networks:
  traefik-network:
    external: true
