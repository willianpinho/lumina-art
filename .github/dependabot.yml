# Dependency policy: SECURITY UPDATES ONLY.
#
# Portfolio repo, not under active development, so routine version-bump PRs are
# pure queue noise (16 were open at once). `open-pull-requests-limit: 0`
# disables Dependabot VERSION updates for each ecosystem below.
#
# Dependabot SECURITY updates are NOT affected: security PRs are exempt from
# this limit and do not count toward it, so advisories still open PRs.
# Repo-level Dependabot alerts + automated security fixes stay enabled.
#
# To resume version updates: raise the limits back above zero.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
